<div class="min-h-screen bg-slate-100 flex flex-col font-sans">
  
  <!-- TELA DE LOGIN (Se não estiver autenticado) -->
  <div *ngIf="!currentUser" class="flex-1 flex flex-col justify-center">
    <app-login></app-login>
  </div>

  <!-- APLICAÇÃO COMPLETA (Após autenticar no Firestore) -->
  <div *ngIf="currentUser" class="flex-1 flex flex-col">
    <!-- CABEÇALHO COM NAVEGAÇÃO E PERMISSÕES -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-xs">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-6 bg-red-600 rounded-xs"></span>
        <h1 class="text-base font-black text-blue-950 uppercase tracking-tight">Junior Express</h1>
      </div>

      <!-- NAVEGAÇÃO BASEADA NA FUNÇÃO -->
      <nav class="flex gap-2">
        <!-- Central: Não visível para Motoboy -->
        <button
          *ngIf="currentUser.funcao !== 'motoboy'"
          (click)="moduloAtual = 'central'"
          [class]="moduloAtual === 'central' ? 'bg-blue-950 text-white' : 'bg-slate-100 text-slate-700'"
          class="px-3 py-1.5 text-xs font-bold uppercase rounded-lg transition-all cursor-pointer"
        >
          Central
        </button>

        <!-- PWA: Visível para Motoboy, Gerente e Admin (Oculto para Atendente) -->
        <button
          *ngIf="currentUser.funcao !== 'atendente'"
          (click)="moduloAtual = 'pwa'"
          [class]="moduloAtual === 'pwa' ? 'bg-blue-950 text-white' : 'bg-slate-100 text-slate-700'"
          class="px-3 py-1.5 text-xs font-bold uppercase rounded-lg transition-all cursor-pointer"
        >
          PWA Motoboy
        </button>

        <!-- Link Cliente: Disponível para Central, Gerente e Admin -->
        <button
          *ngIf="currentUser.funcao !== 'motoboy'"
          (click)="moduloAtual = 'externo'"
          [class]="moduloAtual === 'externo' ? 'bg-blue-950 text-white' : 'bg-slate-100 text-slate-700'"
          class="px-3 py-1.5 text-xs font-bold uppercase rounded-lg transition-all cursor-pointer"
        >
          Link Cliente
        </button>

        <!-- Site: Disponível para Central, Gerente e Admin -->
        <button
          *ngIf="currentUser.funcao !== 'motoboy'"
          (click)="moduloAtual = 'site'"
          [class]="moduloAtual === 'site' ? 'bg-blue-950 text-white' : 'bg-slate-100 text-slate-700'"
          class="px-3 py-1.5 text-xs font-bold uppercase rounded-lg transition-all cursor-pointer"
        >
          Site
        </button>
      </nav>

      <!-- PERFIL DO USUÁRIO LOGADO E BOTÃO SAIR -->
      <div class="flex items-center gap-3">
        <div class="text-right text-xs">
          <p class="font-bold text-slate-900 leading-tight">{{ currentUser.nome }}</p>
          <span
            [class]="currentUser.funcao === 'admin' ? 'text-red-700 font-bold' : currentUser.funcao === 'gerente' ? 'text-blue-700 font-bold' : 'text-slate-500 font-semibold'"
            class="text-[10px] uppercase tracking-wider"
          >
            {{ currentUser.funcao }}
          </span>
        </div>

        <button
          (click)="logout()"
          class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors cursor-pointer"
        >
          Sair
        </button>
      </div>
    </header>

    <!-- CONTEÚDO DOS MÓDULOS -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6">
      <app-central *ngIf="moduloAtual === 'central' && currentUser.funcao !== 'motoboy'"></app-central>
      <app-pwa *ngIf="moduloAtual === 'pwa'"></app-pwa>
      <app-externo *ngIf="moduloAtual === 'externo' && currentUser.funcao !== 'motoboy'"></app-externo>
      <app-site *ngIf="moduloAtual === 'site' && currentUser.funcao !== 'motoboy'"></app-site>
    </main>
  </div>

</div>
