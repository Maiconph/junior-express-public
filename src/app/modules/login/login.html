<div class="min-h-[80vh] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl border border-slate-200 shadow-xl max-w-md w-full p-8 space-y-6">
    
    <!-- CABEÇALHO -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2">
        <span class="w-3 h-7 bg-red-600 rounded-xs"></span>
        <h1 class="text-2xl font-black text-blue-950 uppercase tracking-tight">Junior Express</h1>
      </div>
      <p class="text-xs text-slate-500">
        Acesse o sistema com suas credenciais de colaborador
      </p>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form (submit)="entrar()" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-700 font-semibold mb-1">Usuário / Login *</label>
        <input
          [(ngModel)]="loginVal"
          name="loginVal"
          type="text"
          placeholder="Ex: maicon"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-900 focus:outline-hidden font-medium text-slate-900"
        />
      </div>

      <div>
        <label class="block text-slate-700 font-semibold mb-1">Senha *</label>
        <input
          [(ngModel)]="senhaVal"
          name="senhaVal"
          type="password"
          placeholder="Digite sua senha"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-900 focus:outline-hidden font-medium text-slate-900"
        />
      </div>

      <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-semibold">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="carregando"
        class="w-full py-3.5 bg-blue-950 hover:bg-blue-900 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-md transition-colors cursor-pointer disabled:opacity-50"
      >
        <span *ngIf="!carregando">Entrar no Sistema</span>
        <span *ngIf="carregando">Autenticando...</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400">
      Junior Express Entregas Rápidas • Criciúma - SC
    </div>

  </div>
</div>
